[project]
name = "put-esys-cli"
version = "0.1.0"
description = "CLI tool for Poznań University of Technology electronic systems"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer[all]>=0.9.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "appdirs>=1.4.4",
    "markdownify",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"] # Error, Pyflakes, Isort

[project.scripts]
put-esys = "put_esys.main:app"

[tool.setuptools]
packages = ["put_esys"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
